name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m py_compile ingest.py transcribe.py clean_transcript_ai.py postprocess.py hindsight_save.py
      - name: Run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Check example configuration is sanitized
        run: |
          test ! -f config.env
          ! grep -REn 'gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY-----' . --exclude-dir=.git --exclude-dir=.github
